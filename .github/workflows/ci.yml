name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch cancels the first -- no point burning
# minutes on a commit nobody is waiting for.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest

    services:
      db:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: scamsathi
          POSTGRES_DB: scamsathi
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://postgres:scamsathi@localhost:5432/scamsathi
      SUPABASE_JWT_SECRET: ci-only-secret

    defaults:
      run:
        working-directory: api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: api/requirements-dev.txt

      # Devanagari needs tesseract-ocr-hin; the base package cannot read it.
      # Without this the OCR tests would skip and CI would look green while
      # testing nothing.
      - name: Install Tesseract (eng + hin)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-hin

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Migrate
        run: alembic upgrade head

      - name: Test
        run: python -m pytest -q

      # Guards against a test that skips itself into a false pass: the OCR
      # and history suites must actually run on CI.
      - name: Fail if any test skipped
        run: python -m pytest -q -rs --strict-markers | tee out.txt && ! grep -q "skipped" out.txt

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - run: npm run build

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -t scamsathi-api ./api
